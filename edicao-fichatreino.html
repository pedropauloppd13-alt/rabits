<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Ficha de Treino</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/minhas-cores-claro.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/edicao-fichatreino.css">
</head>

<body class="d-flex flex-column">
    <!--Navbar-->
    <div class="barra-de-nav" id="nav-principal">
        <a class="title" href="login.html">RABITS</a>
        <a class="nav-bnt-selec" id="bnt-inicial" href="index.html"><img src="images/rabit.svg" alt="Rabbit Icon"></a>
        <a class="nav-bnt" id="bnt-ficha" href="fichas.html"><img src="images/icones/card-list.svg" alt="Card List Icon"></a>
        <a class="nav-bnt" id="bnt-ofensiva" href="ofensiva.html"><img src="images/icones/fire.svg" alt="Fire Icon"></a>
        <a class="nav-bnt" id="bnt-perfil" href="perfil.html"><img src="images/icones/person-fill.svg" alt="Profile Icon"></a>
    </div>
    <!-- Main -->
    <main>
        <!-- Calendar -->

        <div class="container" id="ficha-container">
            <div class="days-btn-container">
                <input class="day-btn" id="domingo" type="checkbox" checked="false" />
                <label class="day-label" for="domingo"></label>

                <input class="day-btn" id="segunda" type="checkbox" checked="false" />
                <label class="day-label" for="segunda"></label>

                <input class="day-btn" id="terca" type="checkbox" checked="false" />
                <label class="day-label" for="terca"></label>

                <input class="day-btn" id="quarta" type="checkbox" checked="false" />
                <label class="day-label" for="quarta"></label>

                <input class="day-btn" id="quinta" type="checkbox" checked="false" />
                <label class="day-label" for="quinta"></label>

                <input class="day-btn" id="sexta" type="checkbox" checked="false" />
                <label class="day-label" for="sexta"></label>

                <input class="day-btn" id="sabado" type="checkbox" checked="false" />
                <label class="day-label" for="sabado">1</label>
            </div>

            <!-- Cards -->
            <div class="card treino-card" style="display: none;">
                <img src="..." class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">Treino 1</h5>
                    <p class="card-text">
                        Descrição do treino 1...</p>
                    <div class="card_btns">
                        <a href="#" class="btn btn-primary abrir">
                        Abrir </a>
                        <button href="#" class="btn btn-primary editar-ficha">
                            <img src="images/icones/gear-fill.svg" alt="Edit">
                        </button>
                        <div class="menu-ficha">
                            <button class="opcao-editar">Editar</button>
                            <button class="opcao-excluir">Excluir</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Add more cards as needed -->
            <div class="card order-last" id="criar-treino-card">
                <div class="card-img-overlay">
                    <h5 class="card-title">Criar Treino</h5>
                </div>
                <img src="images/icones/plus-lg2.svg" class="card-img-top" alt="+">
            </div>
    </main>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="edicao-fichatreino.js"></script>
</body>

</html>
