    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rabits</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="minhas-cores-claro.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="d-flex flex-column">
        <!--Navbar-->
        <div class="barra-de-nav" id="nav-principal">
            <p class="title">RABITS</p>
            <a class="nav-bnt-selec" id="bnt-inicial"><img src="images/rabit.svg" alt="Rabbit Icon"></a>
            <a class="nav-bnt" id="bnt-ficha"><img src="images/icones/card-list.svg" alt="Card List Icon"></a>
            <a class="nav-bnt" id="bnt-ofensiva"><img src="images/icones/fire.svg" alt="Fire Icon"></a>
            <a class="nav-bnt" id="bnt-perfil"><img src="images/icones/person-fill.svg" alt="Profile Icon"></a>
        </div>
        <!--Main-->
        <main>
            <div class="container d-flex flex-column justify-content-center text-center">
                <!--Cards-->
                <div class="d-flex justify-content-around flex-wrap mt-5">
                    <div class="mt-2">
                        <div class="card" style="width: 18rem;">
                            <img src="images/fichas.png" class="card-img-top object-fit-cover" alt="Fichas de Treino">
                            <div class="card-body">
                                <h5 class="card-title">Fichas de Treino</h5>
                                <a href="#" class="btn btn-primary">Editar</a>
                            </div>
                        </div>
                    </div>
                    <div class="mt-2">
                        <div class="card" style="width: 18rem;">
                            <img src="images/atividades.png" class="card-img-top object-fit-cover" alt="Atividades">
                            <div class="card-body">
                                <h5 class="card-title">Atividades</h5>
                                <a href="#" class="btn btn-primary">Navegar</a>
                            </div>
                        </div>
                    </div>
                    <div class="mt-2">
                        <div class="card" style="width: 18rem;">
                            <img src="images/ofensiva.png" class="card-img-top object-fit-cover" alt="Ofensiva">
                            <div class="card-body">
                                <h5 class="card-title">Ofensiva</h5>
                                <a href="#" class="btn btn-primary">Verificar Ofensiva</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!--Base-->
                <div class="container text-center">
                    <div class="d-flex justify-content-center flex-wrap">
                        <div class="mt-3 mx-1">
                            <button type="button" class="btn btn-primary btn-lg">
                                <svg fill="#000000" width="30px" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                    <title>play</title>
                                    <path d="M5.92 24.096q0 1.088 0.928 1.728 0.512 0.288 1.088 0.288 0.448 0 0.896-0.224l16.16-8.064q0.48-0.256 0.8-0.736t0.288-1.088-0.288-1.056-0.8-0.736l-16.16-8.064q-0.448-0.224-0.896-0.224-0.544 0-1.088 0.288-0.928 0.608-0.928 1.728v16.16z"></path>
                                </svg>
                                Iniciar Treino
                            </button>
                        </div>
                        <div class="mt-3 mx-1">
                            <button type="button" class="btn btn-danger btn-lg">
                                <svg width="30px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12.8324 21.8013C15.9583 21.1747 20 18.926 20 13.1112C20 7.8196 16.1267 4.29593 13.3415 2.67685C12.7235 2.31757 12 2.79006 12 3.50492V5.3334C12 6.77526 11.3938 9.40711 9.70932 10.5018C8.84932 11.0607 7.92052 10.2242 7.816 9.20388L7.73017 8.36604C7.6304 7.39203 6.63841 6.80075 5.85996 7.3946C4.46147 8.46144 3 10.3296 3 13.1112C3 20.2223 8.28889 22.0001 10.9333 22.0001C11.0871 22.0001 11.2488 21.9955 11.4171 21.9858C10.1113 21.8742 8 21.064 8 18.4442C8 16.3949 9.49507 15.0085 10.631 14.3346C10.9365 14.1533 11.2941 14.3887 11.2941 14.7439V15.3331C11.2941 15.784 11.4685 16.4889 11.8836 16.9714C12.3534 17.5174 13.0429 16.9454 13.0985 16.2273C13.1161 16.0008 13.3439 15.8564 13.5401 15.9711C14.1814 16.3459 15 17.1465 15 18.4442C15 20.4922 13.871 21.4343 12.8324 21.8013Z" fill="#1C274C"/>
                                </svg>
                                Minha Ofensiva
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>

    </html>

</body>

</html>
