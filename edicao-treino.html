<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Treino</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/minhas-cores-claro.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/edicao-treino.css">
</head>

<body class="d-flex flex-column">
    <!--Navbar-->
    <div class="barra-de-nav" id="nav-principal">
        <a class="title" href="index.html">RABITS</a>
        <a class="nav-bnt-selec" id="bnt-inicial" href="index.html"><img src="images/icones/rabit.svg" alt="Rabbit Icon"></a>
        <a class="nav-bnt" id="bnt-ficha" href="fichas.html"><img src="images/icones/card-list.svg" alt="Card List Icon"></a>
        <a class="nav-bnt" id="bnt-ofensiva" href="ofensiva.html"><img src="images/icones/fire.svg" alt="Fire Icon"></a>
        <a class="nav-bnt" id="bnt-perfil" href="perfil.html"><img src="images/icones/person-fill.svg" alt="Profile Icon"></a>
    </div>
    <!-- Main -->
    <main>

        <div class="container">
            <!-- Cards -->
            <div class="card">
                <!-- Imagem Atividade: foto máquina -->
                <img src="images/icones/activity.svg" alt="Activity Icon">
                <a class="card__content" href="edicao-atividade.html">
                    <!-- Nome da atividade -->
                    <p class="card__title">Nome Atividade</p>
                    <!-- Repetições/Séries -->
                    <p class="card__status">Status da atividade</p>
                    <!-- Descrição da atividade -->
                    <p class="card__description">Descrição da atividade...</p>
                </a>
            </div>
            <!-- Add more cards as needed -->
            <a class="card order-last" id="criar-ficha-card" href="criar-atividade.html">
                <div class="card-img-overlay">
                    <h5 class="card-title">Adicionar Atividade</h5>
                </div>
                <img src="images/icones/plus-lg2.svg" class="card-img-top" alt="+">
